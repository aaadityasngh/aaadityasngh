<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes blink {
        0%, 90%, 100% { ry: 8; }
        95% { ry: 1; }
      }
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(12deg); }
        75% { transform: rotate(-4deg); }
      }
      .robot { animation: float 3s ease-in-out infinite; }
      .eye { animation: blink 4s ease-in-out infinite; }
      .eye2 { animation: blink 4s ease-in-out 0.1s infinite; }
      .arm-right { animation: wave 2s ease-in-out infinite; transform-origin: 138px 105px; }
    </style>
  </defs>

  <g class="robot">
    <!-- Antenna -->
    <line x1="100" y1="28" x2="100" y2="45" stroke="#000" stroke-width="3"/>
    <rect x="92" y="18" width="16" height="12" fill="#FFD600" stroke="#000" stroke-width="2.5"/>

    <!-- Head shadow -->
    <rect x="70" y="50" width="70" height="50" rx="0" fill="#000" transform="translate(4,4)"/>
    <!-- Head -->
    <rect x="65" y="45" width="70" height="50" rx="0" fill="#A6FAFF" stroke="#000" stroke-width="3"/>

    <!-- Eyes -->
    <ellipse cx="85" cy="70" rx="8" ry="8" fill="#000" class="eye"/>
    <ellipse cx="115" cy="70" rx="8" ry="8" fill="#000" class="eye2"/>
    <!-- Eye highlights -->
    <circle cx="82" cy="67" r="3" fill="white"/>
    <circle cx="112" cy="67" r="3" fill="white"/>

    <!-- Mouth -->
    <rect x="85" y="82" width="30" height="4" fill="#000" rx="0"/>

    <!-- Body shadow -->
    <rect x="60" y="104" width="90" height="60" rx="0" fill="#000" transform="translate(4,4)"/>
    <!-- Body -->
    <rect x="55" y="100" width="90" height="60" rx="0" fill="#FFD600" stroke="#000" stroke-width="3"/>

    <!-- Chest badge -->
    <rect x="82" y="114" width="36" height="20" fill="#FF90E8" stroke="#000" stroke-width="2"/>
    <text x="100" y="129" text-anchor="middle" font-family="monospace" font-size="10" font-weight="900" fill="#000">AI</text>

    <!-- Code on body -->
    <text x="80" y="150" font-family="monospace" font-size="8" font-weight="700" fill="#000" opacity="0.4">&lt;/&gt;</text>

    <!-- Left arm -->
    <rect x="42" y="107" width="14" height="36" rx="0" fill="#B8FF57" stroke="#000" stroke-width="2.5" transform="translate(-2,2)"/>

    <!-- Right arm (waving) -->
    <g class="arm-right">
      <rect x="147" y="107" width="14" height="36" rx="0" fill="#B8FF57" stroke="#000" stroke-width="2.5"/>
    </g>

    <!-- Legs -->
    <rect x="72" y="162" width="18" height="22" rx="0" fill="#A6FAFF" stroke="#000" stroke-width="2.5"/>
    <rect x="112" y="162" width="18" height="22" rx="0" fill="#A6FAFF" stroke="#000" stroke-width="2.5"/>

    <!-- Feet -->
    <rect x="66" y="184" width="28" height="10" rx="0" fill="#000"/>
    <rect x="108" y="184" width="28" height="10" rx="0" fill="#000"/>
  </g>
</svg>
