<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes blink {
        0%, 90%, 100% { ry: 8; }
        95% { ry: 1; }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(15deg); }
        75% { transform: rotate(-5deg); }
      }
      @keyframes antennaPulse {
        0%, 100% { r: 5; fill: #FF006E; }
        50% { r: 7; fill: #8338EC; }
      }
      .robot { animation: float 3s ease-in-out infinite; }
      .eye { animation: blink 4s ease-in-out infinite; }
      .eye2 { animation: blink 4s ease-in-out 0.1s infinite; }
      .glow { animation: glow 2s ease-in-out infinite; }
      .antenna { animation: antennaPulse 2s ease-in-out infinite; }
      .arm-right { animation: wave 2s ease-in-out infinite; transform-origin: 138px 105px; }
    </style>
  </defs>
  
  <g class="robot">
    <!-- Antenna -->
    <line x1="100" y1="28" x2="100" y2="45" stroke="#8B949E" stroke-width="2"/>
    <circle cx="100" cy="24" class="antenna"/>
    
    <!-- Head -->
    <rect x="65" y="45" width="70" height="50" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    
    <!-- Eyes -->
    <ellipse cx="85" cy="70" rx="8" ry="8" fill="#3A86FF" class="eye"/>
    <ellipse cx="115" cy="70" rx="8" ry="8" fill="#FF006E" class="eye2"/>
    
    <!-- Eye shine -->
    <circle cx="82" cy="67" r="3" fill="white" opacity="0.6"/>
    <circle cx="112" cy="67" r="3" fill="white" opacity="0.6"/>
    
    <!-- Mouth - smile -->
    <path d="M 85 82 Q 100 92 115 82" stroke="#8338EC" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Body -->
    <rect x="55" y="100" width="90" height="60" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    
    <!-- Chest light -->
    <circle cx="100" cy="125" r="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <circle cx="100" cy="125" r="4" fill="#8338EC" class="glow"/>
    
    <!-- Code on chest -->
    <text x="80" y="148" font-family="monospace" font-size="8" fill="#3A86FF" opacity="0.6">&lt;/&gt;</text>
    
    <!-- Left arm -->
    <rect x="38" y="105" width="15" height="40" rx="7" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    
    <!-- Right arm (waving) -->
    <g class="arm-right">
      <rect x="147" y="105" width="15" height="40" rx="7" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    </g>
    
    <!-- Legs -->
    <rect x="70" y="162" width="18" height="25" rx="6" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <rect x="112" y="162" width="18" height="25" rx="6" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    
    <!-- Feet -->
    <rect x="65" y="185" width="28" height="10" rx="5" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <rect x="107" y="185" width="28" height="10" rx="5" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  </g>
</svg>
