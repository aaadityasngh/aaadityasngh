<svg width="900" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes slideIn {
        from { transform: translateX(-20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes pop {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      .main-card { animation: pop 0.6s ease-out both; }
      .tag { animation: slideIn 0.5s ease-out both; }
      .tag1 { animation-delay: 0.3s; }
      .tag2 { animation-delay: 0.45s; }
      .tag3 { animation-delay: 0.6s; }
      .tag4 { animation-delay: 0.75s; }
      .cursor { animation: blink 1s step-end infinite; }
      .star { animation: float 2.5s ease-in-out infinite; }
      .star2 { animation: float 2.5s ease-in-out 0.8s infinite; }
      .star3 { animation: float 2.5s ease-in-out 1.6s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="#FFFDF7" rx="0"/>

  <!-- Subtle grid dots -->
  <g opacity="0.08">
    <circle cx="30" cy="30" r="2" fill="#000"/><circle cx="60" cy="30" r="2" fill="#000"/>
    <circle cx="90" cy="30" r="2" fill="#000"/><circle cx="120" cy="30" r="2" fill="#000"/>
    <circle cx="150" cy="30" r="2" fill="#000"/><circle cx="180" cy="30" r="2" fill="#000"/>
    <circle cx="720" cy="30" r="2" fill="#000"/><circle cx="750" cy="30" r="2" fill="#000"/>
    <circle cx="780" cy="30" r="2" fill="#000"/><circle cx="810" cy="30" r="2" fill="#000"/>
    <circle cx="840" cy="30" r="2" fill="#000"/><circle cx="870" cy="30" r="2" fill="#000"/>
    <circle cx="30" cy="230" r="2" fill="#000"/><circle cx="60" cy="230" r="2" fill="#000"/>
    <circle cx="90" cy="230" r="2" fill="#000"/><circle cx="120" cy="230" r="2" fill="#000"/>
    <circle cx="780" cy="230" r="2" fill="#000"/><circle cx="810" cy="230" r="2" fill="#000"/>
    <circle cx="840" cy="230" r="2" fill="#000"/><circle cx="870" cy="230" r="2" fill="#000"/>
  </g>

  <!-- Main yellow card with brutal shadow -->
  <rect x="99" y="29" width="702" height="140" rx="0" fill="#000"/>
  <rect x="93" y="23" width="702" height="140" rx="0" fill="#FFD600" stroke="#000" stroke-width="3.5" class="main-card"/>

  <!-- Name -->
  <text x="444" y="80" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="#000" letter-spacing="-1">
    ADITYA SINGH
  </text>

  <!-- Role line -->
  <text x="444" y="115" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="16" font-weight="700" fill="#000" letter-spacing="1" opacity="0.75">
    AI / ML ENGINEER
  </text>

  <!-- Tagline -->
  <text x="444" y="148" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#000" opacity="0.5">
    notebooks → production in one sprint_<tspan class="cursor">▊</tspan>
  </text>

  <!-- Neo-brutal tag pills -->
  <g class="tag tag1">
    <rect x="198" y="185" width="108" height="36" rx="0" fill="#000" transform="translate(3,3)"/>
    <rect x="198" y="185" width="108" height="36" rx="0" fill="#FF90E8" stroke="#000" stroke-width="2.5"/>
    <text x="252" y="208" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#000">🧠 LLMs</text>
  </g>

  <g class="tag tag2">
    <rect x="336" y="185" width="108" height="36" rx="0" fill="#000" transform="translate(3,3)"/>
    <rect x="336" y="185" width="108" height="36" rx="0" fill="#A6FAFF" stroke="#000" stroke-width="2.5"/>
    <text x="390" y="208" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#000">⚙️ MLOps</text>
  </g>

  <g class="tag tag3">
    <rect x="474" y="185" width="108" height="36" rx="0" fill="#000" transform="translate(3,3)"/>
    <rect x="474" y="185" width="108" height="36" rx="0" fill="#B8FF57" stroke="#000" stroke-width="2.5"/>
    <text x="528" y="208" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#000">🚀 RAG</text>
  </g>

  <g class="tag tag4">
    <rect x="612" y="185" width="108" height="36" rx="0" fill="#000" transform="translate(3,3)"/>
    <rect x="612" y="185" width="108" height="36" rx="0" fill="#FFD600" stroke="#000" stroke-width="2.5"/>
    <text x="666" y="208" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#000">🐍 Python</text>
  </g>

  <!-- Decorative stars -->
  <text x="55" y="80" font-size="28" class="star">✦</text>
  <text x="830" y="100" font-size="22" class="star2">✦</text>
  <text x="845" y="60" font-size="14" class="star3">✦</text>

  <!-- Bottom border line -->
  <rect x="0" y="248" width="900" height="12" fill="#000"/>
</svg>
