<svg width="900" height="12" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF006E;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#FF006E;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8338EC;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#3A86FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3A86FF;stop-opacity:0"/>
    </linearGradient>
    <style>
      @keyframes dash {
        to { stroke-dashoffset: -24; }
      }
      .line { animation: dash 2s linear infinite; }
    </style>
  </defs>
  <line x1="50" y1="6" x2="850" y2="6" stroke="url(#divGrad)" stroke-width="1.5" stroke-dasharray="8,4" class="line"/>
  <circle cx="450" cy="6" r="3" fill="#8338EC" opacity="0.6"/>
